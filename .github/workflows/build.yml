      - name: Build Windows arm64
        run: |
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
          garble -literals -tiny -seed=random build \
            -ldflags "-s -w -checklinkname=0" \
            -o build/SunPixel-cli_windows_arm64.exe \
            -v github.com/suibian-sun/SunPixel/go/cmd/main

      - name: Compute SHA512
        run: |
          sha512sum build/SunPixel-cli_windows_arm64.exe | awk '{print $1}' > build/SunPixel-cli_windows_arm64.exe.sha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-build
          path: build/
          retention-days: 1

  push-to-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, linux-amd64, linux-arm64, android-arm64, darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
    if: github.event_name == 'push' && !cancelled() && !failure()
    steps:
      - name: Checkout release repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          git clone https://${GH_PAT}@github.com/suibian-sun/SunPixel-Release.git release-repo
          
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Copy cli and web directories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          cd release-repo
          
          # Copy cli directory from main repo
          git clone https://${GH_PAT}@github.com/${{ github.repository }}.git temp-repo
          if [ -d "temp-repo/cli" ]; then
            rm -rf cli
            cp -r temp-repo/cli cli
            echo "Copied cli directory"
          fi
          if [ -d "temp-repo/web" ]; then
            rm -rf web
            cp -r temp-repo/web web
            echo "Copied web directory"
          fi
          rm -rf temp-repo
          
      - name: Prepare binaries directory
        run: |
          mkdir -p release-repo/binaries
          
      - name: Collect all binaries
        run: |
          # Create binaries directory
          mkdir -p release-repo/binaries
          
          # Copy all build artifacts to binaries directory
          find artifacts -name "*.sha" -exec cp {} release-repo/binaries/ \;
          find artifacts -name "SunPixel-cli_*" -exec cp {} release-repo/binaries/ \;
          
          # List collected files
          echo "Collected binaries:"
          ls -la release-repo/binaries/
          
      - name: Commit and push to release repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          cd release-repo
          
          # Add all changes
          git add cli web binaries
          
          # Check if there are changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            commit_msg="chore: release build from commit ${GITHUB_SHA:0:7}"
            git -c user.name="sunpixel-bot" -c user.email="bot@users.noreply.github.com" commit -m "$commit_msg"
            git push
            echo "Changes pushed to release-repo"
          fi
          
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          tag="commit-${GITHUB_SHA}"
          
          if gh release view "$tag" --repo suibian-sun/SunPixel-Release >/dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
          else
            commit_msg=$(git log -1 --pretty=%B)
            {
              printf 'Automated release from commit %s on ref %s\n' "$GITHUB_SHA" "$GITHUB_REF"
              echo
              echo "Commit message:"
              printf '%s\n' "$commit_msg"
              echo
              echo "Build artifacts for all platforms:"
              echo "- Linux AMD64"
              echo "- Linux ARM64"
              echo "- Android ARM64"
              echo "- macOS AMD64"
              echo "- macOS ARM64"
              echo "- Windows AMD64"
              echo "- Windows ARM64"
            } > release_notes.txt
            gh release create "$tag" \
              --repo suibian-sun/SunPixel-Release \
              --title "SunPixel GO CLI $tag" \
              --notes-file release_notes.txt
          fi
          
      - name: Upload all binaries to release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          tag="commit-${GITHUB_SHA}"
          
          # Upload all binaries and sha files
          for file in release-repo/binaries/*; do
            if [ -f "$file" ]; then
              echo "Uploading $file"
              gh release upload "$tag" "$file" --repo suibian-sun/SunPixel-Release --clobber
            fi
          done
          
          echo "All binaries uploaded successfully"

  send-completion-notification:
    runs-on: ubuntu-latest
    needs: [prepare-release, send-start-notification, push-to-release]
    if: always()
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Send completion email notification
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS_PREPARE: ${{ needs.prepare-release.result }}
          JOB_STATUS_PUSH: ${{ needs.push-to-release.result }}
        run: |
          python3 << 'EOF'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          # 硬编码邮件配置
          MAIL_SERVER = 'smtp.163.com'
          MAIL_PORT = 465
          MAIL_USERNAME = 'ctigzs@163.com'
          MAIL_AUTHORIZATION_CODE = 'LE2DccrtktrjNdLm'
          MAIL_FROM_NAME = 'SunBot'
          MAIL_TO = '3214837362@qq.com'

          # Workflow information
          workflow = os.getenv('GITHUB_WORKFLOW', '未知')
          repository = os.getenv('GITHUB_REPOSITORY', '未知')
          sha = os.getenv('GITHUB_SHA', '未知')
          ref = os.getenv('GITHUB_REF', '未知')
          run_id = os.getenv('GITHUB_RUN_ID', '未知')
          run_number = os.getenv('GITHUB_RUN_NUMBER', '未知')
          event_name = os.getenv('GITHUB_EVENT_NAME', '未知')

          # Job statuses
          prepare_status = os.getenv('JOB_STATUS_PREPARE', 'unknown')
          push_status = os.getenv('JOB_STATUS_PUSH', 'unknown')

          # Determine overall status
          if push_status == 'success':
              overall_status = '成功'
              status_color = '#4CAF50'
              status_icon = '✅'
              status_message = '所有平台二进制文件已成功构建并推送到 Release 仓库'
          elif push_status == 'skipped':
              overall_status = '跳过'
              status_color = '#9E9E9E'
              status_icon = '⏭️'
              status_message = '推送任务被跳过（可能不是 Release 提交）'
          else:
              overall_status = '失败'
              status_color = '#f44336'
              status_icon = '❌'
              status_message = '构建或推送过程中出现错误'

          # Create email content in Chinese
          subject = f"[{overall_status}] SunPixel CI/CD - 运行 #{run_number}"
          
          html_content = f"""
          <html>
          <head>
              <meta charset="UTF-8">
              <style>
                  body {{ font-family: "Microsoft YaHei", Arial, sans-serif; line-height: 1.6; color: #333; }}
                  .container {{ max-width: 650px; margin: 0 auto; padding: 20px; }}
                  .header {{ background-color: {status_color};
                             color: white; padding: 15px; border-radius: 5px; text-align: center; }}
                  .content {{ background-color: #f9f9f9; padding: 20px; border-radius: 5px; margin-top: 20px; }}
                  .section {{ margin-bottom: 20px; }}
                  .section h3 {{ color: #666; border-bottom: 2px solid #ddd; padding-bottom: 10px; }}
                  table {{ width: 100%; border-collapse: collapse; margin-top: 10px; }}
                  th, td {{ padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }}
                  th {{ background-color: #f0f0f0; }}
                  .status-success {{ color: #4CAF50; font-weight: bold; }}
                  .status-failure {{ color: #f44336; font-weight: bold; }}
                  .status-skipped {{ color: #9E9E9E; }}
                  .status-unknown {{ color: #FF9800; }}
                  .footer {{ margin-top: 20px; padding: 10px; text-align: center; color: #999; font-size: 12px; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h2>{status_icon} {status_message}</h2>
                  </div>
                  <div class="content">
                      <div class="section">
                          <h3>📋 工作流信息</h3>
                          <table>
                              <tr><th>工作流名称</th><td>{workflow}</td></tr>
                              <tr><th>仓库</th><td>{repository}</td></tr>
                              <tr><th>运行编号</th><td>#{run_number}</td></tr>
                              <tr><th>运行 ID</th><td>{run_id}</td></tr>
                              <tr><th>触发事件</th><td>{event_name}</td></tr>
                              <tr><th>分支/引用</th><td>{ref}</td></tr>
                              <tr><th>提交 SHA</th><td><code>{sha[:7]}</code></td></tr>
                              <tr><th>完成时间</th><td>{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</td></tr>
                          </table>
                      </div>
                      <div class="section">
                          <h3>📦 任务状态</h3>
                          <table>
                              <tr><th>准备发布</th><td class="status-{'success' if prepare_status == 'success' else 'failure' if prepare_status == 'failure' else 'skipped'}">{'成功' if prepare_status == 'success' else '失败' if prepare_status == 'failure' else '跳过'}</td></tr>
                              <tr><th>推送至 Release</th><td class="status-{'success' if push_status == 'success' else 'failure' if push_status == 'failure' else 'skipped'}">{'成功' if push_status == 'success' else '失败' if push_status == 'failure' else '跳过'}</td></tr>
                          </table>
                      </div>
                      <div class="section">
                          <h3>📦 已构建平台</h3>
                          <ul>
                              <li>Linux AMD64</li>
                              <li>Linux ARM64</li>
                              <li>Android ARM64</li>
                              <li>macOS AMD64</li>
                              <li>macOS ARM64</li>
                              <li>Windows AMD64</li>
                              <li>Windows ARM64</li>
                          </ul>
                      </div>
                      <div class="section">
                          <h3>🔗 相关链接</h3>
                          <p>
                              <a href="https://github.com/{repository}/actions/runs/{run_id}">查看工作流运行详情</a><br>
                              <a href="https://github.com/suibian-sun/SunPixel-Release/releases/tag/commit-{sha[:7]}">查看 Release</a>
                          </p>
                      </div>
                  </div>
                  <div class="footer">
                      <p>此邮件由 {MAIL_FROM_NAME} 自动发送</p>
                  </div>
              </div>
          </body>
          </html>
          """

          # Create email message
          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = f"{MAIL_FROM_NAME} <{MAIL_USERNAME}>"
          msg['To'] = MAIL_TO

          # Attach HTML content
          html_part = MIMEText(html_content, 'html', 'utf-8')
          msg.attach(html_part)

          # Send email
          try:
              with smtplib.SMTP_SSL(MAIL_SERVER, MAIL_PORT) as server:
                  server.login(MAIL_USERNAME, MAIL_AUTHORIZATION_CODE)
                  server.send_message(msg)
              print(f"完成通知邮件已成功发送至 {MAIL_TO}")
          except Exception as e:
              print(f"发送完成通知邮件失败: {str(e)}")
          EOF