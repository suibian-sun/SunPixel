            -ldflags "-s -w -checklinkname=0" \
            -o build/SunPixel-cli_darwin_amd64 \
            -v github.com/suibian-sun/SunPixel/go/cmd/main

      - name: Compute SHA512
        run: |
          sha512sum build/SunPixel-cli_darwin_amd64 | awk '{print $1}' > build/SunPixel-cli_darwin_amd64.sha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-amd64-build
          path: build/
          retention-days: 1

  darwin-arm64:
    runs-on: ubuntu-latest
    needs: [prepare-release, send-start-notification]
    if: always() && needs.prepare-release.result != 'skipped'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
