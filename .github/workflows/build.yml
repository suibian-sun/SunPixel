name: SunPixel Build on Push

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Check and create release repository if not exists
        env:
          GH_TOKEN: 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
        run: |
          set -e
          if gh repo view suibian-sun/SunPixel-Release >/dev/null 2>&1; then
            echo "Repository suibian-sun/SunPixel-Release already exists"
          else
            echo "Repository suibian-sun/SunPixel-Release does not exist, creating..."
            gh repo create suibian-sun/SunPixel-Release --public --description "SunPixel Release Repository"
            echo "Repository created successfully"
          fi

      - name: Initialize release repository if empty
        env:
          GH_PAT: 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
        run: |
          set -e
          git clone https://oauth2:${GH_PAT}@github.com/suibian-sun/SunPixel-Release.git release-repo
          cd release-repo
          if git rev-parse HEAD >/dev/null 2>&1; then
            echo "Release repo already initialized"
          else
            echo "Initializing empty release repo"
            git checkout -b main
            echo "# SunPixel Release" > README.md
            git add README.md
            git -c user.name="sunpixel-bot" -c user.email="bot@users.noreply.github.com" commit -m "chore: initial commit"
            git push -u origin main
          fi

  linux-amd64:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize Go module
        run: |
          cd go
          go mod init github.com/suibian-sun/SunPixel/go 2>/dev/null || true
          go mod tidy

      - name: Install garble
        run: go install mvdan.cc/garble@latest

      - name: Prepare build directory
        run: mkdir -p build

      - name: Build Linux amd64
        working-directory: go
        run: |
          GOOS=linux GOARCH=amd64 \
          garble -literals -tiny -seed=random build \
            -ldflags "-s -w -checklinkname=0" \
            -o ../build/SunPixel-cli_linux_amd64 \
            -v ./cmd/main.go

      - name: UPX compress artifact
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: build/SunPixel-cli_linux_amd64
          args: -fq

      - name: Compute SHA512
        run: |
          cd build
          sha512sum SunPixel-cli_linux_amd64 | awk '{print $1}' > SunPixel-cli_linux_amd64.sha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-build
          path: build/
          retention-days: 1

  linux-arm64:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize Go module
        run: |
          cd go
          go mod init github.com/suibian-sun/SunPixel/go 2>/dev/null || true
          go mod tidy

      - name: Install garble
        run: go install mvdan.cc/garble@latest

      - name: Prepare build directory
        run: mkdir -p build

      - name: Build Linux arm64
        working-directory: go
        run: |
          export GOOS=linux
          export GOARCH=arm64
          export CGO_ENABLED=0
          
          garble -seed=random build \
            -ldflags="-s -w -checklinkname=0" \
            -o ../build/SunPixel-cli_linux_arm64 \
            -v ./cmd/main.go

      - name: UPX compress artifact
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: build/SunPixel-cli_linux_arm64
          args: -fq
        continue-on-error: true

      - name: Compute SHA512
        run: |
          cd build
          if [ -f "SunPixel-cli_linux_arm64" ]; then
            sha512sum SunPixel-cli_linux_arm64 | awk '{print $1}' > SunPixel-cli_linux_arm64.sha
          else
            echo "" > SunPixel-cli_linux_arm64.sha
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-build
          path: build/
          retention-days: 1

  android-arm64:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize Go module
        run: |
          cd go
          go mod init github.com/suibian-sun/SunPixel/go 2>/dev/null || true
          go mod tidy

      - name: Install garble
        run: go install mvdan.cc/garble@latest

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Prepare build directory
        run: mkdir -p build

      - name: Build Android arm64
        working-directory: go
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          CC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC" \
          garble -literals -tiny -seed=random build \
            -ldflags "-s -w -checklinkname=0" \
            -o ../build/SunPixel-cli_android_arm64 \
            -v ./cmd/main.go

      - name: UPX compress artifact
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: build/SunPixel-cli_android_arm64
          args: -fq
        continue-on-error: true

      - name: Compute SHA512
        run: |
          cd build
          sha512sum SunPixel-cli_android_arm64 | awk '{print $1}' > SunPixel-cli_android_arm64.sha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-build
          path: build/
          retention-days: 1

