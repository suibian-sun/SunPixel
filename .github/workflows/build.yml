name: SunPixel Build on Push

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'Release')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Check and create release repository if not exists
        if: github.event_name == 'push'
        env:
          GH_TOKEN: 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
        run: |
          set -e
          # Check if repository exists
          if gh repo view suibian-sun/SunPixel-Release >/dev/null 2>&1; then
            echo "Repository suibian-sun/SunPixel-Release already exists"
          else
            echo "Repository suibian-sun/SunPixel-Release does not exist, creating..."
            gh repo create suibian-sun/SunPixel-Release --public --description "SunPixel Release Repository"
            echo "Repository created successfully"
          fi

      - name: Initialize release repository if empty
        if: github.event_name == 'push'
        env:
          GH_PAT: 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
        run: |
          set -e
          git clone https://oauth2:${GH_PAT}@github.com/suibian-sun/SunPixel-Release.git release-repo
          cd release-repo
          if git rev-parse HEAD >/dev/null 2>&1; then
            echo "Release repo already initialized"
          else
            echo "Initializing empty release repo"
            git checkout -b main
            echo "# SunPixel Release" > README.md
            git add README.md
            git -c user.name="sunpixel-bot" -c user.email="bot@users.noreply.github.com" commit -m "chore: initial commit"
            git push -u origin main
          fi

  send-start-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Send start email notification
        run: |
          python3 << 'EOF'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          # 硬编码邮件配置
          MAIL_SERVER = 'smtp.163.com'
          MAIL_PORT = 465
          MAIL_USERNAME = 'ctigzs@163.com'
          MAIL_AUTHORIZATION_CODE = 'LE2DccrtktrjNdLm'
          MAIL_FROM_NAME = 'SunBot'
          MAIL_TO = '3214837362@qq.com'

          # Workflow information
          workflow = os.getenv('GITHUB_WORKFLOW', '未知')
          repository = os.getenv('GITHUB_REPOSITORY', '未知')
          sha = os.getenv('GITHUB_SHA', '未知')
          ref = os.getenv('GITHUB_REF', '未知')
          run_id = os.getenv('GITHUB_RUN_ID', '未知')
          run_number = os.getenv('GITHUB_RUN_NUMBER', '未知')
          event_name = os.getenv('GITHUB_EVENT_NAME', '未知')

          # Create email content in Chinese
          subject = f"[开始构建] SunPixel CI/CD - 运行 #{run_number}"
          
          html_content = f"""
          <html>
          <head>
              <meta charset="UTF-8">
              <style>
                  body {{ font-family: "Microsoft YaHei", Arial, sans-serif; line-height: 1.6; color: #333; }}
                  .container {{ max-width: 650px; margin: 0 auto; padding: 20px; }}
                  .header {{ background-color: #2196F3; color: white; padding: 15px; border-radius: 5px; text-align: center; }}
                  .content {{ background-color: #f9f9f9; padding: 20px; border-radius: 5px; margin-top: 20px; }}
                  .section {{ margin-bottom: 20px; }}
                  .section h3 {{ color: #666; border-bottom: 2px solid #ddd; padding-bottom: 10px; }}
                  table {{ width: 100%; border-collapse: collapse; margin-top: 10px; }}
                  th, td {{ padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }}
                  th {{ background-color: #f0f0f0; }}
                  .footer {{ margin-top: 20px; padding: 10px; text-align: center; color: #999; font-size: 12px; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h2>🚀 构建任务已开始</h2>
                  </div>
                  <div class="content">
                      <div class="section">
                          <h3>📋 工作流信息</h3>
                          <table>
                              <tr><th>工作流名称</th><td>{workflow}</td></tr>
                              <tr><th>仓库</th><td>{repository}</td></tr>
                              <tr><th>运行编号</th><td>#{run_number}</td></tr>
                              <tr><th>运行 ID</th><td>{run_id}</td></tr>
                              <tr><th>触发事件</th><td>{event_name}</td></tr>
                              <tr><th>分支/引用</th><td>{ref}</td></tr>
                              <tr><th>提交 SHA</th><td><code>{sha[:7]}</code></td></tr>
                              <tr><th>开始时间</th><td>{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</td></tr>
                          </table>
                      </div>
                      <div class="section">
                          <h3>🔧 构建任务</h3>
                          <p>以下平台正在构建中：</p>
                          <ul>
                              <li>Linux AMD64</li>
                              <li>Linux ARM64</li>
                              <li>Android ARM64</li>
                              <li>macOS AMD64</li>
                              <li>macOS ARM64</li>
                              <li>Windows AMD64</li>
                              <li>Windows ARM64</li>
                          </ul>
                      </div>
                      <div class="section">
                          <h3>🔗 相关链接</h3>
                          <p>
                              <a href="https://github.com/{repository}/actions/runs/{run_id}">查看工作流运行详情</a>
                          </p>
                      </div>
                  </div>
                  <div class="footer">
                      <p>此邮件由 {MAIL_FROM_NAME} 自动发送</p>
                  </div>
              </div>
          </body>
          </html>
          """

          # Create email message
          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = f"{MAIL_FROM_NAME} <{MAIL_USERNAME}>"
          msg['To'] = MAIL_TO

          # Attach HTML content
          html_part = MIMEText(html_content, 'html', 'utf-8')
          msg.attach(html_part)

          # Send email
          try:
              with smtplib.SMTP_SSL(MAIL_SERVER, MAIL_PORT) as server:
                  server.login(MAIL_USERNAME, MAIL_AUTHORIZATION_CODE)
                  server.send_message(msg)
              print(f"开始通知邮件已成功发送至 {MAIL_TO}")
          except Exception as e:
              print(f"发送开始通知邮件失败: {str(e)}")
          EOF

  linux-amd64:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize Go module
        run: |
          cd go
          go mod init github.com/suibian-sun/SunPixel/go 2>/dev/null || true
          go mod tidy

      - name: Install garble
        run: go install mvdan.cc/garble@latest

      - name: Prepare build directory
        run: mkdir -p build

      - name: Build Linux amd64
        working-directory: go
        run: |
          GOOS=linux GOARCH=amd64 \
          garble -literals -tiny -seed=random build \
            -ldflags "-s -w -checklinkname=0" \
            -o ../build/SunPixel-cli_linux_amd64 \
            -v ./cmd/main.go

      - name: UPX compress artifact
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: build/SunPixel-cli_linux_amd64
          args: -fq

      - name: Compute SHA512
        run: |
          cd build
          sha512sum SunPixel-cli_linux_amd64 | awk '{print $1}' > SunPixel-cli_linux_amd64.sha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-build
          path: build/
          retention-days: 1

