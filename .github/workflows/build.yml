  # 检查所有构建任务的状态
  check-build-status:
    runs-on: ubuntu-latest
    needs: [linux-amd64, linux-arm64, android-arm64, darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release')
    outputs:
      should_push: ${{ steps.check.outputs.should_push }}
    steps:
      - name: Check all build jobs status
        id: check
        run: |
          # 获取所有构建任务的状态
          LINUX_AMD64="${{ needs.linux-amd64.result }}"
          LINUX_ARM64="${{ needs.linux-arm64.result }}"
          ANDROID_ARM64="${{ needs.android-arm64.result }}"
          DARWIN_AMD64="${{ needs.darwin-amd64.result }}"
          DARWIN_ARM64="${{ needs.darwin-arm64.result }}"
          WINDOWS_AMD64="${{ needs.windows-amd64.result }}"
          WINDOWS_ARM64="${{ needs.windows-arm64.result }}"
          
          # 计算失败的任务数量
          FAILED_COUNT=0
          [[ "$LINUX_AMD64" == "failure" ]] && FAILED_COUNT=$((FAILED_COUNT+1))
          [[ "$LINUX_ARM64" == "failure" ]] && FAILED_COUNT=$((FAILED_COUNT+1))
          [[ "$ANDROID_ARM64" == "failure" ]] && FAILED_COUNT=$((FAILED_COUNT+1))
          [[ "$DARWIN_AMD64" == "failure" ]] && FAILED_COUNT=$((FAILED_COUNT+1))
          [[ "$DARWIN_ARM64" == "failure" ]] && FAILED_COUNT=$((FAILED_COUNT+1))
          [[ "$WINDOWS_AMD64" == "failure" ]] && FAILED_COUNT=$((FAILED_COUNT+1))
          [[ "$WINDOWS_ARM64" == "failure" ]] && FAILED_COUNT=$((FAILED_COUNT+1))
          
          echo "Failed jobs count: $FAILED_COUNT"
          
          # 只有当至少有一个任务失败时才跳过推送
          if [ $FAILED_COUNT -gt 0 ]; then
            echo "⚠️ 有 $FAILED_COUNT 个构建任务失败，跳过推送到 release 仓库"
            echo "should_push=false" >> $GITHUB_OUTPUT
          else
            echo "✅ 所有 7 个构建任务均成功完成，将推送到 release 仓库"
            echo "should_push=true" >> $GITHUB_OUTPUT
          fi

  push-to-release:
    runs-on: ubuntu-latest
    needs: [check-build-status, linux-amd64, linux-arm64, android-arm64, darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release') && needs.check-build-status.outputs.should_push == 'true'
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: current-repo
          
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Clone release repository
        run: |
          set -e
          # 硬编码 PAT
          GH_PAT="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"
          git clone https://oauth2:${GH_PAT}@github.com/suibian-sun/SunPixel-Release.git release-repo
          
      - name: Copy cli and web directories
        run: |
          set -e
          cd release-repo
          
          # 从已检出的当前仓库复制 cli 目录
          if [ -d "../current-repo/cli" ]; then
            rm -rf cli
            cp -r ../current-repo/cli cli
            echo "Copied cli directory"
          fi
          
          # 从已检出的当前仓库复制 web 目录
          if [ -d "../current-repo/web" ]; then
            rm -rf web
            cp -r ../current-repo/web web
            echo "Copied web directory"
          fi
          
      - name: Prepare binaries directory
        run: |
          mkdir -p release-repo/binaries
          
      - name: Collect all binaries
        run: |
          set -e
          # 创建二进制文件目录
          mkdir -p release-repo/binaries
          
          # 复制所有构建产物到二进制文件目录
          if [ -d "artifacts" ]; then
            # 查找所有构建目录
            for build_dir in artifacts/*-build; do
              if [ -d "$build_dir" ]; then
                echo "Processing $build_dir"
                cp -v $build_dir/* release-repo/binaries/ 2>/dev/null || true
              fi
            done
          fi
          
          # 列出收集的文件
          echo "Collected binaries:"
          ls -la release-repo/binaries/ || echo "No binaries found"
          
      - name: Configure Git
        run: |
          git config --global user.name "sunpixel-bot"
          git config --global user.email "bot@users.noreply.github.com"
          
      - name: Commit and push to release repo
        run: |
          set -e
          cd release-repo
          
          # 添加所有更改
          git add cli web binaries
          
          # 检查是否有更改需要提交
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            commit_msg="chore: release build from commit ${GITHUB_SHA:0:7}"
            git commit -m "$commit_msg"
            
            # 硬编码 PAT 用于推送
            GH_PAT="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"
            git push https://oauth2:${GH_PAT}@github.com/suibian-sun/SunPixel-Release.git main
            echo "Changes pushed to release-repo"
          fi
          
      - name: Create GitHub Release
        env:
          GH_TOKEN: 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
        run: |
          set -e
          tag="commit-${GITHUB_SHA}"
          
          # 检查 Release 是否已存在
          if gh release view "$tag" --repo suibian-sun/SunPixel-Release >/dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
          else
            # 获取提交信息
            cd current-repo
            commit_msg=$(git log -1 --pretty=%B)
            cd ..
            
            # 创建 Release 说明
            {
              printf 'Automated release from commit %s on ref %s\n\n' "$GITHUB_SHA" "$GITHUB_REF"
              echo "Commit message:"
              printf '%s\n' "$commit_msg"
              echo
              echo "Build artifacts for all platforms:"
              echo "- Linux AMD64"
              echo "- Linux ARM64"
              echo "- Android ARM64"
              echo "- macOS AMD64"
              echo "- macOS ARM64"
              echo "- Windows AMD64"
              echo "- Windows ARM64"
            } > release_notes.txt
            
            # 创建 Release
            gh release create "$tag" \
              --repo suibian-sun/SunPixel-Release \
              --title "SunPixel GO CLI $tag" \
              --notes-file release_notes.txt
          fi
          
      - name: Upload all binaries to release
        env:
          GH_TOKEN: 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
        run: |
          set -e
          tag="commit-${GITHUB_SHA}"
          
          # 检查是否有二进制文件需要上传
          if [ -d "release-repo/binaries" ] && [ "$(ls -A release-repo/binaries)" ]; then
            # 上传所有二进制文件和 sha 文件
            for file in release-repo/binaries/*; do
              if [ -f "$file" ]; then
                echo "Uploading $file"
                gh release upload "$tag" "$file" --repo suibian-sun/SunPixel-Release --clobber
              fi
            done
            echo "All binaries uploaded successfully"
          else
            echo "No binaries found to upload"
          fi

  send-completion-notification:
    runs-on: ubuntu-latest
    needs: [linux-amd64, linux-arm64, android-arm64, darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
    if: always()
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Send completion email notification
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS_LINUX_AMD64: ${{ needs.linux-amd64.result }}
          JOB_STATUS_LINUX_ARM64: ${{ needs.linux-arm64.result }}
          JOB_STATUS_ANDROID_ARM64: ${{ needs.android-arm64.result }}
          JOB_STATUS_DARWIN_AMD64: ${{ needs.darwin-amd64.result }}
          JOB_STATUS_DARWIN_ARM64: ${{ needs.darwin-arm64.result }}
          JOB_STATUS_WINDOWS_AMD64: ${{ needs.windows-amd64.result }}
          JOB_STATUS_WINDOWS_ARM64: ${{ needs.windows-arm64.result }}
        run: |
          python3 << 'EOF'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          # 硬编码邮件配置
          MAIL_SERVER = 'smtp.163.com'
          MAIL_PORT = 465
          MAIL_USERNAME = 'ctigzs@163.com'
          MAIL_AUTHORIZATION_CODE = 'LE2DccrtktrjNdLm'
          MAIL_FROM_NAME = 'SunBot'
          MAIL_TO = '3214837362@qq.com'

          # Workflow information
          workflow = os.getenv('GITHUB_WORKFLOW', '未知')
          repository = os.getenv('GITHUB_REPOSITORY', '未知')
          sha = os.getenv('GITHUB_SHA', '未知')
          ref = os.getenv('GITHUB_REF', '未知')
          run_id = os.getenv('GITHUB_RUN_ID', '未知')
          run_number = os.getenv('GITHUB_RUN_NUMBER', '未知')
          event_name = os.getenv('GITHUB_EVENT_NAME', '未知')

          # Job statuses
          jobs_cn = {
              'linux-amd64': os.getenv('JOB_STATUS_LINUX_AMD64', 'unknown'),
              'linux-arm64': os.getenv('JOB_STATUS_LINUX_ARM64', 'unknown'),
              'android-arm64': os.getenv('JOB_STATUS_ANDROID_ARM64', 'unknown'),
              'darwin-amd64': os.getenv('JOB_STATUS_DARWIN_AMD64', 'unknown'),
              'darwin-arm64': os.getenv('JOB_STATUS_DARWIN_ARM64', 'unknown'),
              'windows-amd64': os.getenv('JOB_STATUS_WINDOWS_AMD64', 'unknown'),
              'windows-arm64': os.getenv('JOB_STATUS_WINDOWS_ARM64', 'unknown'),
          }

          # Job display names in Chinese
          job_display_names = {
              'linux-amd64': 'Linux AMD64',
              'linux-arm64': 'Linux ARM64',
              'android-arm64': 'Android ARM64',
              'darwin-amd64': 'macOS AMD64',
              'darwin-arm64': 'macOS ARM64',
              'windows-amd64': 'Windows AMD64',
              'windows-arm64': 'Windows ARM64',
          }

          # Determine overall status
          has_failure = any(status == 'failure' for status in jobs_cn.values())
          has_skipped = any(status == 'skipped' for status in jobs_cn.values())
          
          if has_failure:
              overall_status = '失败'
              status_color = '#f44336'
              status_icon = '❌'
              status_message = '构建过程中出现错误'
          elif has_skipped:
              overall_status = '部分跳过'
              status_color = '#FF9800'
              status_icon = '⚠️'
              status_message = '部分构建任务被跳过'
          else:
              overall_status = '成功'
              status_color = '#4CAF50'
              status_icon = '✅'
              status_message = '所有平台二进制文件已成功构建'

          # Create email content in Chinese
          subject = f"[{overall_status}] SunPixel CI/CD - 运行 #{run_number}"
          
          # Status display in Chinese
          status_display_map = {
              'success': '成功',
              'failure': '失败',
              'skipped': '跳过',
              'unknown': '未知'
          }
          
          html_content = f"""
          <html>
          <head>
              <meta charset="UTF-8">
              <style>
                  body {{ font-family: "Microsoft YaHei", Arial, sans-serif; line-height: 1.6; color: #333; }}
                  .container {{ max-width: 650px; margin: 0 auto; padding: 20px; }}
                  .header {{ background-color: {status_color};
                             color: white; padding: 15px; border-radius: 5px; text-align: center; }}
                  .content {{ background-color: #f9f9f9; padding: 20px; border-radius: 5px; margin-top: 20px; }}
                  .section {{ margin-bottom: 20px; }}
                  .section h3 {{ color: #666; border-bottom: 2px solid #ddd; padding-bottom: 10px; }}
                  table {{ width: 100%; border-collapse: collapse; margin-top: 10px; }}
                  th, td {{ padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }}
                  th {{ background-color: #f0f0f0; }}
                  .status-success {{ color: #4CAF50; font-weight: bold; }}
                  .status-failure {{ color: #f44336; font-weight: bold; }}
                  .status-skipped {{ color: #9E9E9E; }}
                  .status-unknown {{ color: #FF9800; }}
                  .footer {{ margin-top: 20px; padding: 10px; text-align: center; color: #999; font-size: 12px; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h2>{status_icon} {status_message}</h2>
                  </div>
                  <div class="content">
                      <div class="section">
                          <h3>📋 工作流信息</h3>
                          <table>
                              <tr><th>工作流名称</th><td>{workflow}</td></tr>
                              <tr><th>仓库</th><td>{repository}</td></tr>
                              <tr><th>运行编号</th><td>#{run_number}</td></tr>
                              <tr><th>运行 ID</th><td>{run_id}</td></tr>
                              <tr><th>触发事件</th><td>{event_name}</td></tr>
                              <tr><th>分支/引用</th><td>{ref}</td></tr>
                              <tr><th>提交 SHA</th><td><code>{sha[:7]}</code></td></tr>
                              <tr><th>完成时间</th><td>{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</td></tr>
                          </table>
                      </div>
                      <div class="section">
                          <h3>📦 任务状态</h3>
                          <table>
                              <tr><th>任务</th><th>状态</th></tr>
          """

          for job_name, status in jobs_cn.items():
              display_name = job_display_names.get(job_name, job_name)
              status_class = f'status-{status}' if status in ['success', 'failure', 'skipped'] else 'status-unknown'
              status_text = status_display_map.get(status, status)
              html_content += f'<tr><td>{display_name}</td><td class="{status_class}">{status_text}</td></tr>\n'

          html_content += f"""
                          </table>
                      </div>
                      <div class="section">
                          <h3>🔗 相关链接</h3>
                          <p>
                              <a href="https://github.com/{repository}/actions/runs/{run_id}">查看工作流运行详情</a>
                          </p>
                      </div>
                  </div>
                  <div class="footer">
                      <p>此邮件由 {MAIL_FROM_NAME} 自动发送</p>
                  </div>
              </div>
          </body>
          </html>
          """

          # Create email message
          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = f"{MAIL_FROM_NAME} <{MAIL_USERNAME}>"
          msg['To'] = MAIL_TO

          # Attach HTML content
          html_part = MIMEText(html_content, 'html', 'utf-8')
          msg.attach(html_part)

          # Send email
          try:
              with smtplib.SMTP_SSL(MAIL_SERVER, MAIL_PORT) as server:
                  server.login(MAIL_USERNAME, MAIL_AUTHORIZATION_CODE)
                  server.send_message(msg)
              print(f"完成通知邮件已成功发送至 {MAIL_TO}")
          except Exception as e:
              print(f"发送完成通知邮件失败: {str(e)}")
          EOF