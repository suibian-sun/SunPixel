      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-build
          path: build/
          retention-days: 1

  windows-arm64:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize Go module
        run: |
          cd go
          go mod init github.com/suibian-sun/SunPixel/go 2>/dev/null || true
          go mod tidy

      - name: Install garble
        run: go install mvdan.cc/garble@latest

      - name: Prepare build directory
        run: mkdir -p build

      - name: Build Windows arm64
        working-directory: go
        run: |
          export GOOS=windows
          export GOARCH=arm64
          export CGO_ENABLED=0
          
          # 不使用 garble 的 literals 和 tiny 选项，避免加密包问题
          garble -seed=random build \
            -ldflags="-s -w -checklinkname=0" \
            -o ../build/SunPixel-cli_windows_arm64.exe \
            -v ./cmd/main.go

      - name: UPX compress artifact
        uses: crazy-max/ghaction-upx@v3
        with:
