            -o build/SunPixel-cli_darwin_arm64 \
            -v github.com/suibian-sun/SunPixel/go/cmd/main

      - name: Compute SHA512
        run: |
          sha512sum build/SunPixel-cli_darwin_arm64 | awk '{print $1}' > build/SunPixel-cli_darwin_arm64.sha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-build
          path: build/
          retention-days: 1

  windows-amd64:
    runs-on: ubuntu-latest
    needs: [prepare-release, send-start-notification]
    if: always() && needs.prepare-release.result != 'skipped'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install garble
        run: go install mvdan.cc/garble@latest

      - name: Prepare build directory
        run: mkdir -p build

      - name: Generate constants
        run: go generate ./constants

      - name: Build Windows amd64
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
          garble -literals -tiny -seed=random build \
            -ldflags "-s -w -checklinkname=0" \
            -o build/SunPixel-cli_windows_amd64.exe \
            -v github.com/suibian-sun/SunPixel/go/cmd/main

      - name: UPX compress artifact
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: build/SunPixel-cli_windows_amd64.exe
          args: -fq

      - name: Compute SHA512
        run: |
          sha512sum build/SunPixel-cli_windows_amd64.exe | awk '{print $1}' > build/SunPixel-cli_windows_amd64.exe.sha

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64-build
          path: build/
          retention-days: 1

  windows-arm64:
    runs-on: ubuntu-latest
    needs: [prepare-release, send-start-notification]
    if: always() && needs.prepare-release.result != 'skipped'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
