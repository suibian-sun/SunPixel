          if [ -f "SunPixel-cli_windows_arm64.exe" ]; then
            sha512sum SunPixel-cli_windows_arm64.exe | awk '{print $1}' > SunPixel-cli_windows_arm64.exe.sha
          else
            echo "" > SunPixel-cli_windows_arm64.exe.sha
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-build
          path: build/
          retention-days: 1

  push-to-release:
    runs-on: ubuntu-latest
    needs: [linux-amd64, linux-arm64, android-arm64, darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
    if: always()
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: current-repo
          
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true
          
      - name: Prepare binaries directory
        run: mkdir -p binaries
          
      - name: Collect all binaries
        run: |
          set -e
          if [ -d "artifacts" ]; then
            for build_dir in artifacts/*-build; do
              if [ -d "$build_dir" ]; then
                echo "Processing $build_dir"
                cp -v $build_dir/* binaries/ 2>/dev/null || true
              fi
            done
          fi
          echo "Collected binaries:"
          ls -la binaries/ || echo "No binaries found"

      - name: Package Python and Web directories
        run: |
          set -e
          mkdir -p package_temp
          
          if [ -d "current-repo/python" ]; then
            cp -r current-repo/python package_temp/python
            echo "Copied python directory"
          fi
          
          if [ -d "current-repo/web" ]; then
            cp -r current-repo/web package_temp/web
            echo "Copied web directory"
          fi
          
          cd package_temp
          if [ "$(ls -A)" ]; then
            zip -r ../binaries/SunPixel-python-web.zip . -x "*.git*" "*.pyc" "*__pycache__*"
            echo "Packaged SunPixel-python-web.zip"
          else
            echo "No python or web directories found"
          fi
          cd ..
          rm -rf package_temp
          
      - name: Create GitHub Release with Card Style
        env:
          GH_TOKEN: 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
        run: |
          set -e
          tag="commit-${GITHUB_SHA}"
          
          cd current-repo
          update_log=""
          if [ -f "UpdateLog.log" ]; then
            update_log=$(cat UpdateLog.log)
            echo "Update log loaded"
          else
            echo "Warning: UpdateLog.log not found"
            update_log="No update log available for this build"
          fi
          cd ..
          
          # 创建卡片样式的 Release 说明
          cat > release_notes.md << 'EOF'
          <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
            
            <!-- 发行内容卡片 -->
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; padding: 2px; margin-bottom: 24px;">
              <div style="background: white; border-radius: 14px; padding: 24px;">
                <h2 style="margin: 0 0 16px 0; color: #333; display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 28px;">📦</span> 
                  <span>发布内容</span>
                </h2>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px;">
                  <div style="background: #f8f9fa; border-radius: 12px; padding: 16px; border-left: 4px solid #667eea;">
                    <h3 style="margin: 0 0 12px 0; color: #667eea; font-size: 18px;">🎯 二进制文件</h3>
                    <ul style="margin: 0; padding-left: 20px; line-height: 1.6;">
                      <li><code style="background: #e9ecef; padding: 2px 6px; border-radius: 4px;">SunPixel-cli_linux_amd64</code> - Linux AMD64</li>
                      <li><code style="background: #e9ecef; padding: 2px 6px; border-radius: 4px;">SunPixel-cli_linux_arm64</code> - Linux ARM64</li>
                      <li><code style="background: #e9ecef; padding: 2px 6px; border-radius: 4px;">SunPixel-cli_android_arm64</code> - Android ARM64</li>
                      <li><code style="background: #e9ecef; padding: 2px 6px; border-radius: 4px;">SunPixel-cli_darwin_amd64</code> - macOS AMD64</li>
                      <li><code style="background: #e9ecef; padding: 2px 6px; border-radius: 4px;">SunPixel-cli_darwin_arm64</code> - macOS ARM64</li>
                      <li><code style="background: #e9ecef; padding: 2px 6px; border-radius: 4px;">SunPixel-cli_windows_amd64.exe</code> - Windows AMD64</li>
                      <li><code style="background: #e9ecef; padding: 2px 6px; border-radius: 4px;">SunPixel-cli_windows_arm64.exe</code> - Windows ARM64</li>
                    </ul>
                  </div>
                  
                  <div style="background: #f8f9fa; border-radius: 12px; padding: 16px; border-left: 4px solid #48bb78;">
                    <h3 style="margin: 0 0 12px 0; color: #48bb78; font-size: 18px;">📚 源代码包</h3>
                    <ul style="margin: 0; padding-left: 20px; line-height: 1.6;">
                      <li><code style="background: #e9ecef; padding: 2px 6px; border-radius: 4px;">SunPixel-python-web.zip</code> - Python & Web 源代码</li>
                    </ul>
                  </div>
                </div>
                
                <div style="background: #fef5e7; border-radius: 12px; padding: 16px; border-left: 4px solid #f59e0b;">
                  <h3 style="margin: 0 0 8px 0; color: #f59e0b; font-size: 18px;">ℹ️ 构建信息</h3>
                  <p style="margin: 0; color: #666; line-height: 1.6;">
                    <strong>提交 SHA:</strong> <code>${GITHUB_SHA}</code><br>
                    <strong>分支:</strong> ${GITHUB_REF#refs/heads/}<br>
                    <strong>构建时间:</strong> $(date -u '+%Y-%m-%d %H:%M:%S UTC')
                  </p>
                </div>
              </div>
            </div>
            
            <!-- 更新日志卡片 -->
            <div style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); border-radius: 16px; padding: 2px;">
              <div style="background: white; border-radius: 14px; padding: 24px;">
                <h2 style="margin: 0 0 16px 0; color: #333; display: flex; align-items: center; gap: 8px;">
                  <span style="font-size: 28px;">📝</span> 
                  <span>更新日志</span>
                </h2>
                <div style="background: #fafafa; border-radius: 12px; padding: 20px; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 14px; line-height: 1.6; color: #2c3e50; overflow-x: auto;">
          EOF
          
          # 添加更新日志内容
          echo "$update_log" | while IFS= read -r line; do
            echo "          $line" >> release_notes.md
          done
          
          cat >> release_notes.md << 'EOF'
                </div>
                <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #e9ecef; text-align: right;">
                  <span style="color: #999; font-size: 12px;">📅 自动生成于 $(date -u '+%Y-%m-%d %H:%M:%S') UTC</span>
                </div>
              </div>
            </div>
          </div>
          EOF
          
          if gh release view "$tag" --repo suibian-sun/SunPixel-Release >/dev/null 2>&1; then
            echo "Release $tag already exists, updating assets..."
          else
            gh release create "$tag" \
              --repo suibian-sun/SunPixel-Release \
              --title "SunPixel GO CLI WEB commit-${GITHUB_SHA}" \
              --notes-file release_notes.md
            echo "Release created: $tag"
          fi
          
      - name: Upload all binaries to release
        env:
          GH_TOKEN: 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
        run: |
          set -e
          tag="commit-${GITHUB_SHA}"
          
          if [ -d "binaries" ] && [ "$(ls -A binaries)" ]; then
            for file in binaries/*; do
              if [ -f "$file" ]; then
                echo "Uploading $file"
                gh release upload "$tag" "$file" --repo suibian-sun/SunPixel-Release --clobber
              fi
            done
            echo "All files uploaded successfully"
          else
            echo "No files to upload"
          fi

  send-completion-notification:
    runs-on: ubuntu-latest
    needs: [linux-amd64, linux-arm64, android-arm64, darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
    if: always()
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Send completion email notification
        env:
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          JOB_STATUS_LINUX_AMD64: ${{ needs.linux-amd64.result }}
          JOB_STATUS_LINUX_ARM64: ${{ needs.linux-arm64.result }}
          JOB_STATUS_ANDROID_ARM64: ${{ needs.android-arm64.result }}
          JOB_STATUS_DARWIN_AMD64: ${{ needs.darwin-amd64.result }}
          JOB_STATUS_DARWIN_ARM64: ${{ needs.darwin-arm64.result }}
          JOB_STATUS_WINDOWS_AMD64: ${{ needs.windows-amd64.result }}
          JOB_STATUS_WINDOWS_ARM64: ${{ needs.windows-arm64.result }}
        run: |
          python3 << 'PYTHON_EOF'
          import os
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          MAIL_SERVER = 'smtp.163.com'
          MAIL_PORT = 465
          MAIL_USERNAME = 'ctigzs@163.com'
          MAIL_AUTHORIZATION_CODE = 'LE2DccrtktrjNdLm'
          MAIL_FROM_NAME = 'SunBot'
          MAIL_TO = '3214837362@qq.com'

          workflow = os.getenv('GITHUB_WORKFLOW', 'Unknown')
          repository = os.getenv('GITHUB_REPOSITORY', 'Unknown')
          sha = os.getenv('GITHUB_SHA', 'Unknown')
          ref = os.getenv('GITHUB_REF', 'Unknown')
          run_id = os.getenv('GITHUB_RUN_ID', 'Unknown')
          run_number = os.getenv('GITHUB_RUN_NUMBER', 'Unknown')
          event_name = os.getenv('GITHUB_EVENT_NAME', 'Unknown')

          jobs_cn = {
              'linux-amd64': os.getenv('JOB_STATUS_LINUX_AMD64', 'unknown'),
              'linux-arm64': os.getenv('JOB_STATUS_LINUX_ARM64', 'unknown'),
              'android-arm64': os.getenv('JOB_STATUS_ANDROID_ARM64', 'unknown'),
              'darwin-amd64': os.getenv('JOB_STATUS_DARWIN_AMD64', 'unknown'),
              'darwin-arm64': os.getenv('JOB_STATUS_DARWIN_ARM64', 'unknown'),
              'windows-amd64': os.getenv('JOB_STATUS_WINDOWS_AMD64', 'unknown'),
              'windows-arm64': os.getenv('JOB_STATUS_WINDOWS_ARM64', 'unknown'),
          }

          job_display_names = {
              'linux-amd64': 'Linux AMD64',
              'linux-arm64': 'Linux ARM64',
              'android-arm64': 'Android ARM64',
              'darwin-amd64': 'macOS AMD64',
              'darwin-arm64': 'macOS ARM64',
              'windows-amd64': 'Windows AMD64',
              'windows-arm64': 'Windows ARM64',
          }

          has_failure = any(status == 'failure' for status in jobs_cn.values())
          has_skipped = any(status == 'skipped' for status in jobs_cn.values())
          
          if has_failure:
              overall_status = 'Failed'
              status_color = '#f44336'
              status_icon = '❌'
              status_message = 'Build completed with errors'
          elif has_skipped:
              overall_status = 'Partial'
              status_color = '#FF9800'
              status_icon = '⚠️'
              status_message = 'Some build tasks were skipped'
          else:
              overall_status = 'Success'
              status_color = '#4CAF50'
              status_icon = '✅'
              status_message = 'All platforms built successfully'

          subject = f"[{overall_status}] SunPixel CI/CD - Run #{run_number}"
          
          status_display_map = {
              'success': 'Success',
              'failure': 'Failed',
              'skipped': 'Skipped',
              'unknown': 'Unknown'
          }
          
          html_content = f"""
          <html>
          <head>
              <meta charset="UTF-8">
              <style>
                  body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; }}
                  .container {{ max-width: 650px; margin: 0 auto; padding: 20px; }}
                  .header {{ background-color: {status_color}; color: white; padding: 15px; border-radius: 12px; text-align: center; }}
                  .content {{ background-color: #f9f9f9; padding: 20px; border-radius: 12px; margin-top: 20px; }}
                  .section {{ margin-bottom: 20px; }}
                  .section h3 {{ color: #666; border-bottom: 2px solid #ddd; padding-bottom: 10px; }}
                  table {{ width: 100%; border-collapse: collapse; margin-top: 10px; }}
                  th, td {{ padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }}
                  th {{ background-color: #f0f0f0; }}
                  .status-success {{ color: #4CAF50; font-weight: bold; }}
                  .status-failure {{ color: #f44336; font-weight: bold; }}
                  .status-skipped {{ color: #9E9E9E; }}
                  .footer {{ margin-top: 20px; padding: 10px; text-align: center; color: #999; font-size: 12px; }}
              </style>
          </head>
          <body>
              <div class="container">
                  <div class="header">
                      <h2>{status_icon} {status_message}</h2>
                  </div>
                  <div class="content">
                      <div class="section">
                          <h3>Workflow Information</h3>
                          <table>
                              <tr><th>Workflow</th><td>{workflow}</td>
                              <tr><th>Repository</th><td>{repository}</td>
                              <tr><th>Run Number</th><td>#{run_number}</td>
                              <tr><th>Run ID</th><td>{run_id}</td>
                              <tr><th>Event</th><td>{event_name}</td>
                              <tr><th>Ref</th><td>{ref}</td>
                              <tr><th>Commit SHA</th><td><code>{sha[:7]}</code></td>
                              <tr><th>Completed</th><td>{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</td>
                          </table>
                      </div>
                      <div class="section">
                          <h3>Job Status</h3>
                          <tr>
                              <tr><th>Job</th><th>Status</th>
          """
          for job_name, status in jobs_cn.items():
              display_name = job_display_names.get(job_name, job_name)
              status_class = f'status-{status}' if status in ['success', 'failure', 'skipped'] else 'status-unknown'
              status_text = status_display_map.get(status, status)
              html_content += f'<tr><td>{display_name}</td><td class="{status_class}">{status_text}</td></tr>\n'
          html_content += f"""
                          </table>
                      </div>
                      <div class="section">
                          <h3>Links</h3>
                          <p><a href="https://github.com/{repository}/actions/runs/{run_id}">View workflow run details</a></p>
                      </div>
                  </div>
                  <div class="footer">
                      <p>This email was sent automatically by {MAIL_FROM_NAME}</p>
                  </div>
              </div>
          </body>
          </html>
          """
          msg = MIMEMultipart('alternative')
          msg['Subject'] = subject
          msg['From'] = f"{MAIL_FROM_NAME} <{MAIL_USERNAME}>"
          msg['To'] = MAIL_TO
          html_part = MIMEText(html_content, 'html', 'utf-8')
          msg.attach(html_part)
          try:
              with smtplib.SMTP_SSL(MAIL_SERVER, MAIL_PORT) as server:
                  server.login(MAIL_USERNAME, MAIL_AUTHORIZATION_CODE)
                  server.send_message(msg)
              print(f"Completion email sent to {MAIL_TO}")
          except Exception as e:
              print(f"Failed to send completion email: {str(e)}")
          PYTHON_EOF
